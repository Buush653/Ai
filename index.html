<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZuaAI - Powered by Gemini 2.0 Flash</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Zua<span>AI</span></h1>
            <p>Powered by Gemini 2.0 Flash</p>
        </div>
        <div class="header-controls">
            <button id="new-chat-btn"><i class="fas fa-plus"></i> New Chat</button>
            <button id="dark-mode-toggle"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <main>
        <div class="chat-container">
            <div class="welcome-message" id="welcome-message">
                <h2>Welcome to ZuaAI</h2>
                <p>Powered by Google's Gemini 2.0 Flash with real-time web access. Ask me anything!</p>
                <div class="suggestions">
                    <button class="suggestion-btn">What's the latest tech news?</button>
                    <button class="suggestion-btn">Explain quantum computing</button>
                    <button class="suggestion-btn">Current weather in New York</button>
                    <button class="suggestion-btn">Latest SpaceX launch details</button>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="typing-indicator" id="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="user-input" placeholder="Ask ZuaAI anything..." rows="1"></textarea>
                <div class="input-controls">
                    <button id="web-toggle" class="active" title="Web Access">
                        <i class="fas fa-globe"></i>
                    </button>
                    <button id="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
            <div class="disclaimer">
                <p>ZuaAI may produce inaccurate information. Powered by Google Gemini 2.0 Flash API.</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
